# ClickWars: Territory - CI Pipeline
#
# Jobs:
#   1. backend      - Tests unitaires + smoke test du serveur Node.js
#   2. build        - Compilation Qt6/QML (anti-regression n1)
#   3. consistency  - Verification automatique CMakeLists/qmldir/fichiers
#   4. stats        - Statistiques du projet

name: ClickWars CI

permissions:
  contents: read

on:
  push:
    branches: [main, mike]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================
  # 1. BACKEND - Tests serveur Node.js
  # ===================================
  backend:
    name: Backend Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./server
        run: npm install --ignore-scripts

      - name: Syntax check
        working-directory: ./server
        run: |
          for f in GameServer.js websocket-server.js; do
            node --check "$f" && echo "OK $f"
          done

      - name: Unit tests
        working-directory: ./server
        run: node tests.js

      - name: Smoke test - server startup
        working-directory: ./server
        run: |
          node websocket-server.js &
          SERVER_PID=$!
          sleep 3

          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server started successfully (PID: $SERVER_PID)"
            kill $SERVER_PID
          else
            echo "Server crashed at startup!"
            exit 1
          fi

      - name: Security audit
        working-directory: ./server
        run: npm audit --audit-level=high || echo "Vulnerabilities detected (non-blocking)"

  # ===================================
  # 2. BUILD - Compilation Qt6/QML
  # ===================================
  build:
    name: Build Qt/QML
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtwebsockets"

      - name: CMake configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        run: cmake --build build --parallel

  # ===================================
  # 3. CONSISTENCY - Coherence fichiers
  # ===================================
  consistency:
    name: Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check file consistency
        run: bash scripts/check-consistency.sh

  # ===================================
  # 4. STATS - Resume du projet
  # ===================================
  stats:
    name: Project Stats
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Project summary
        run: |
          echo "=== ClickWars: Territory ==="
          echo ""
          echo "Files:"
          echo "  QML      : $(find . -name '*.qml' | wc -l)"
          echo "  JS (QML) : $(find ./qml -name '*.js' 2>/dev/null | wc -l)"
          echo "  JS (srv) : $(find ./server -name '*.js' -not -path '*/node_modules/*' | wc -l)"
          echo "  C++      : $(find . -name '*.cpp' -o -name '*.h' | wc -l)"
          echo ""
          echo "Lines of code:"
          echo "  QML : $(find . -name '*.qml' -exec cat {} + 2>/dev/null | wc -l)"
          echo "  JS  : $(find . -name '*.js' -not -path '*/node_modules/*' -exec cat {} + 2>/dev/null | wc -l)"
          echo "  C++ : $(find . \( -name '*.cpp' -o -name '*.h' \) -exec cat {} + 2>/dev/null | wc -l)"
          echo ""
          echo "Components:"
          echo "  Screens  : $(ls qml/screens/*.qml 2>/dev/null | wc -l)"
          echo "  Widgets  : $(ls qml/components/*.qml 2>/dev/null | wc -l)"
          echo "  Scripts  : $(ls server/*.js 2>/dev/null | grep -v node_modules | wc -l)"
